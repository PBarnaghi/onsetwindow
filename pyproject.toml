[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onsetwindow"
version = "0.1.0"
description = "Transition age and windows of opportunity under an accumulating, whole-body burden model of Alzheimer's disease"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Payam Barnaghi", email = "p.barnaghi@imperial.ac.uk" }]
keywords = ["Alzheimer's disease", "dementia", "risk model", "window of opportunity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
fast = ["scipy>=1.8"]
dev = ["pytest>=7", "scipy>=1.8"]

[project.scripts]
onsetwindow = "onsetwindow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
